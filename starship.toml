# ~/.config/starship.toml
# Sane minimal Starship config

add_newline = true
command_timeout = 1000

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$kubernetes\
$docker_context\
$python\
$nodejs\
$cmd_duration\
$line_break
"""

# ---------- Prompt character ----------

#[character]
#success_symbol = "[❯](bold green)"
#error_symbol = "[❯](bold red)"
#vimcmd_symbol = "[❮](bold green)"

# ---------- Directory ----------

[directory]
style = "bold blue"
truncation_length = 0
truncate_to_repo = false
read_only = " "

# ---------- Git ----------

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "[$all_status$ahead_behind]($style) "
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$"
modified = "~${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# ---------- Kubernetes ----------

[kubernetes]
disabled = false
symbol = "☸ "
style = "bold cyan"
format = '[$symbol$context( \($namespace\))]($style) '

# ---------- Docker ----------

[docker_context]
disabled = false
symbol = " "
style = "blue"
format = "[$symbol$context]($style) "

# ---------- Languages / runtimes ----------

[python]
symbol = " "
style = "yellow"
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

# ---------- Command duration ----------

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = " took [$duration]($style)"

# ---------- User / host ----------

[username]
disabled = true

[hostname]
disabled = true

