# ============================================================
# Core
# ============================================================

set -g mouse on
set -g history-limit 50000
setw -g mode-keys vi

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g default-terminal "tmux-256color"
set -sg escape-time 10


# ============================================================
# Windows
# ============================================================

# New windows inherit the current pane's working directory
bind c new-window -c "#{pane_current_path}"

# Previous / next window
bind -n M-[ previous-window
bind -n M-] next-window

# Rename current window
bind -n M-E command-prompt -I "#W" "rename-window -- '%%'"


# ============================================================
# Pane navigation
#
# Alt + Arrow
# Alt + h/j/k/l
# ============================================================

bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R


# ============================================================
# Pane resizing
#
# Alt + Shift + Arrow
# ============================================================

bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Down  resize-pane -D 5
bind -n M-S-Up    resize-pane -U 5
bind -n M-S-Right resize-pane -R 5


# ============================================================
# Pane creation
#
# Alt + -    split top/bottom
# Alt + /    split left/right
# ============================================================

bind -n 'M--' split-window -v -c "#{pane_current_path}"
bind -n 'M-/' split-window -h -c "#{pane_current_path}"


# ============================================================
# Pane focus
#
# Alt + f    zoom / unzoom
# ============================================================

bind -n M-f resize-pane -Z

# ============================================================
# Scrollback
#
# Alt + PageUp           enter scrollback / page up
# Alt + PageDown         move towards live output
#
# Alt + Shift + Up       enter scrollback / half page up
# Alt + Shift + Down     half page down
#
# In copy mode:
#
#   j / k                down / up
#   Ctrl-d / Ctrl-u      half page down / up
#   g / G                oldest / newest
#   /                    search
#   n / N                next / previous result
#   q                    return to live terminal
# ============================================================

# Full-page scrollback
bind -n M-PPage copy-mode -eu

bind -T copy-mode-vi M-PPage send-keys -X page-up
bind -T copy-mode-vi M-NPage send-keys -X page-down-and-cancel


# Half-page scrollback
bind -n M-S-Up copy-mode \; send-keys -X halfpage-up

bind -T copy-mode-vi M-S-Up   send-keys -X halfpage-up
bind -T copy-mode-vi M-S-Down send-keys -X halfpage-down

# ============================================================
# Sessions
#
# Alt + Shift + w    new window
# Alt + Shift + s    see / switch sessions
# Alt + Shift + r    rename session
# Alt + Shift + d    detach session
# ============================================================

bind -n M-W new-window -c "#{pane_current_path}"
bind -n M-S choose-tree -Zs
bind -n M-R command-prompt -I "#S" "rename-session -- '%%'"
bind -n M-D detach-client


# ============================================================
# Configuration
#
# Ctrl-b r    reload config
# ============================================================

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"


# ============================================================
# Forged theme
#
# Background         #212737
# Foreground         #eaedf3
# Accent             #ff6b01
# Muted              #343f60
# Muted foreground   #afb9ca
# Border             #ab4b08
# ============================================================


# ------------------------------------------------------------
# Status bar
# ------------------------------------------------------------

set -g status on
set -g status-position bottom
set -g status-interval 5

set -g status-style "bg=#212737,fg=#afb9ca"

set -g status-left-length 30
set -g status-right-length 50

# Current session
set -g status-left \
  '#[fg=#ff6b01,bold] #S #[fg=#343f60]│'

# Date / time
set -g status-right \
  '#[fg=#343f60]│ #[fg=#afb9ca]%a %d %b  #[fg=#eaedf3]%H:%M '


# ------------------------------------------------------------
# Windows
#
# Intentionally omit window numbers from the UI.
# Keep the chrome focused on semantic context.
# ------------------------------------------------------------

set -g window-status-separator ""

set -g window-status-format \
  '#[fg=#afb9ca]  #W  '

set -g window-status-current-format \
  '#[fg=#ff6b01,bold]  #W  '

set -g window-status-activity-style \
  "fg=#eaedf3,bold"


# ------------------------------------------------------------
# Pane borders
# ------------------------------------------------------------

set -g pane-border-style \
  "fg=#343f60"

set -g pane-active-border-style \
  "fg=#ab4b08"


# ------------------------------------------------------------
# Messages / prompts
# ------------------------------------------------------------

set -g message-style \
  "bg=#343f60,fg=#eaedf3"

set -g message-command-style \
  "bg=#343f60,fg=#ff6b01"


# ------------------------------------------------------------
# Copy / scrollback mode
# ------------------------------------------------------------

set -g mode-style \
  "bg=#343f60,fg=#eaedf3"


# ------------------------------------------------------------
# Pane-number overlay
#
# Ctrl-b q
# ------------------------------------------------------------

set -g display-panes-colour "#afb9ca"
set -g display-panes-active-colour "#ff6b01"


# ------------------------------------------------------------
# Clock mode
# ------------------------------------------------------------

set -g clock-mode-colour "#ff6b01"

